<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header>
      <h1>TaskFlow <span class="accent">AI</span></h1>
      <p class="subtitle">مدیریت هوشمند کارهای روزانه</p>
    </header>

    <form id="task-form">
      <input type="text" id="title" placeholder="عنوان کار (مثلاً: امروز پروژه رو تحویل بده)" required>
      <textarea id="description" placeholder="توضیحات (اختیاری)"></textarea>
      <button type="submit">افزودن کار</button>
    </form>

    <div id="tasks-list"></div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
